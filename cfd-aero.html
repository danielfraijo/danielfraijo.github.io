<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CFD force coefficients</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>html,body{margin:0;background:#000;height:100%}#c{width:100%;height:100%}</style>
</head>
<body>
  <div id="c"></div>
  <script>
    const mach = [0.6,0.8,0.95,1.05,1.2,1.5,2.0,2.5,3.0];
    const layout = {
      paper_bgcolor:"#000", plot_bgcolor:"#000",
      font:{family:"Barlow Condensed, sans-serif", color:"#f0f0fa", size:12},
      margin:{l:48,r:20,t:36,b:44},
      legend:{orientation:"h", y:1.12},
      xaxis:{title:"MACH", gridcolor:"rgba(240,240,250,0.08)", zeroline:false},
      yaxis:{title:"COEFFICIENT", gridcolor:"rgba(240,240,250,0.08)", zeroline:false},
      hovermode:"x unified"
    };
    Plotly.newPlot("c",[
      {x:mach,y:[0.42,0.40,0.37,0.31,0.28,0.24,0.19,0.16,0.14],name:"CL  α=4°",mode:"lines+markers",line:{color:"#9ad7ff",width:2}},
      {x:mach,y:[0.018,0.021,0.034,0.048,0.041,0.033,0.028,0.026,0.025],name:"CD  α=4°",mode:"lines+markers",line:{color:"#f0f0fa",width:2,dash:"dot"}}
    ],layout,{responsive:true,displaylogo:false});
  </script>
</body>
</html>
