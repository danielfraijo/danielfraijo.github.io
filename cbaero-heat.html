<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CBAERO heating</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>html,body{margin:0;background:#000;height:100%}#c{width:100%;height:100%}</style>
</head>
<body>
  <div id="c"></div>
  <script>
    const t=[0,10,20,30,40,50,60,80,100,120,150,180];
    const layout={
      paper_bgcolor:"#000", plot_bgcolor:"#000",
      font:{family:"Barlow Condensed, sans-serif", color:"#f0f0fa", size:12},
      margin:{l:56,r:20,t:36,b:44},
      legend:{orientation:"h", y:1.12},
      xaxis:{title:"TIME (s)", gridcolor:"rgba(240,240,250,0.08)", zeroline:false},
      yaxis:{title:"HEAT FLUX (W/cm²)", gridcolor:"rgba(240,240,250,0.08)", zeroline:false},
      hovermode:"x unified"
    };
    Plotly.newPlot("c",[
      {x:t,y:[2,8,21,46,71,88,79,54,33,21,14,9],name:"NOSE STAGNATION",mode:"lines",line:{color:"#ffb4a2",width:2}},
      {x:t,y:[1,4,11,22,34,41,37,26,16,11,7,5],name:"LEADING EDGE",mode:"lines",line:{color:"#9ad7ff",width:2}}
    ],layout,{responsive:true,displaylogo:false});
  </script>
</body>
</html>
